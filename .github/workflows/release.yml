# Every day: if AsamK has released a new signal-cli, bump VERSION, build both gems,
# check the bundled binary runs, push the gems to RubyGems.org and tag the release.
# Pushes to main only build and test.
name: Release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Bump to the latest upstream release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/AsamK/signal-cli/releases/latest --jq .tag_name | sed 's/^v//')
          current=$(ruby -Ilib -rsignal-cli -e 'print SignalCli::UPSTREAM_VERSION')
          if [ "$latest" != "$current" ]; then
            sed -i "s/VERSION = \".*\"/VERSION = \"$latest\"/" lib/signal-cli.rb
          fi

      - run: rake package test smoke

      - uses: rubygems/configure-rubygems-credentials@v1.0.0
        if: github.event_name != 'push'

      # Each gem on its own, so a run that failed halfway finishes the job next time.
      - name: Push the gems RubyGems.org doesn't have yet
        if: github.event_name != 'push'
        run: |
          for gem in pkg/*.gem; do
            read -r version platform < <(ruby -rrubygems/package -e 'spec = Gem::Package.new(ARGV[0]).spec; puts "#{spec.version} #{spec.platform}"' "$gem")
            if ! curl -fsS -o /dev/null "https://rubygems.org/api/v2/rubygems/signal-cli/versions/$version.json?platform=$platform"; then
              gem push "$gem"
            fi
          done

      - name: Commit and tag the release
        if: github.event_name != 'push'
        run: |
          version=$(ruby -Ilib -rsignal-cli -e 'print SignalCli::VERSION')
          if [ -z "$(git ls-remote --tags origin "v$version")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update to signal-cli $version" || true
            git tag "v$version"
            git push origin HEAD:main "v$version"
          fi
